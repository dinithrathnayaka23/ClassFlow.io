spring:
  application:
    name: classflow-api
  datasource:
    # Sensitive values loaded from .env via spring-dotenv
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    # Leave MAIL_HOST unset and no mail is sent: Mailer logs the message instead, so the
    # password reset flow is still testable with no SMTP account. Any provider works -
    # Gmail with an app password, Brevo, Mailgun, Resend, or a local MailHog on port 1025.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      # Without these a silent or unreachable SMTP server holds a sending thread for as long
      # as the OS lets it, and the small pool below would fill up with stuck sends.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  task:
    execution:
      pool:
        # The pool behind Mailer's @Async sends. Small and bounded on purpose: mail is the
        # only thing here that waits on a third party, so a slow SMTP server can queue up but
        # cannot spawn threads without limit. A full queue makes the caller send it inline,
        # which slows one request down rather than dropping somebody's reset link.
        core-size: 2
        max-size: 4
        queue-capacity: 100
  servlet:
    multipart:
      # Per file, and for the whole request. A submission may carry several files at once,
      # so the request allowance is deliberately a multiple of the per-file one; scanned
      # coursework runs large, which is what the old shared 20MB cap kept rejecting.
      max-file-size: ${MAX_FILE_SIZE:40MB}
      max-request-size: ${MAX_REQUEST_SIZE:160MB}
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
app:
  # JWT secret loaded from .env — never has a hardcoded fallback
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  upload-dir: ${UPLOAD_DIR:./uploads}
  storage:
    # Set a bucket to store uploads in S3-compatible object storage instead of the local
    # disk. Required in any hosted environment: container filesystems do not survive a
    # redeploy, so submissions and attachments would be lost.
    bucket: ${S3_BUCKET:}
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:auto}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  secure-cookies: ${SECURE_COOKIES:false}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
  # The single ADMIN account, provisioned on startup by AdminBootstrap.
  # Admins cannot self-register, so these credentials are the only way in.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:ClassFlow Admin}
    reset-password: ${ADMIN_RESET_PASSWORD:false}
  mail:
    # Transports are tried in this order and the first one configured wins. The HTTP API is
    # listed first on purpose: where a deployment has both, it is because outbound SMTP is
    # blocked there, and preferring the transport that works avoids every send timing out.
    order: ${MAIL_PROVIDER_ORDER:brevo,smtp}
    # The From. Providers reject a From they do not own, so this has to be an address you
    # have verified with them - normally the same mailbox as MAIL_USERNAME for SMTP.
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:ClassFlow}
    timeout-seconds: ${MAIL_TIMEOUT_SECONDS:15}
    brevo:
      # Send over HTTPS instead of SMTP. Required on hosts that block outbound SMTP, which
      # includes Render: there, port 587 does not refuse the connection, it silently times
      # out, so correct SMTP credentials fail in a way that looks like a broken mail account.
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
  password-reset:
    # How long a reset link stays usable. Short, because the link is as good as the password
    # while it lives; long enough that mail delivery and a distracted user still fit inside it.
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    # How many links one address may ask for inside the window below. A backstop against
    # burying a mailbox in reset mail, not a gate: nobody legitimately asks ten times in a
    # quarter of an hour, and a completed reset clears the count outright. Set to 0 to remove
    # the cap altogether, at the cost of letting anyone send unlimited mail to any registered
    # address.
    max-requests: ${PASSWORD_RESET_MAX_REQUESTS:10}
    window-minutes: ${PASSWORD_RESET_WINDOW_MINUTES:15}
  # AI help. Providers are tried in the order below and the first one that
  # answers wins; a provider with no API key is skipped. With no keys set at all
  # the assistant falls back to built-in guidance, so the feature still works.
  ai:
    order: ${AI_PROVIDER_ORDER:gemini,groq}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
