spring:
  application:
    name: classflow-api
  datasource:
    # Sensitive values loaded from .env via spring-dotenv
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
app:
  # JWT secret loaded from .env — never has a hardcoded fallback
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  upload-dir: ${UPLOAD_DIR:./uploads}
  secure-cookies: ${SECURE_COOKIES:false}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
